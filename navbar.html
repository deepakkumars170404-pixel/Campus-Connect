<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Campus Connect Navbar</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      margin: 0;
      padding-top: 80px;
      font-family: Arial, sans-serif;
      background-color: #f4f7fb;
    }

    .custom-navbar {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(12px);
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.08);
    }

    .navbar-brand {
      font-size: 1.5rem;
      font-weight: 800;
      color: #123f49;
    }

    .navbar-brand:hover {
      color: #1d6f7a;
    }

    .nav-link {
      color: #324055;
      font-weight: 600;
      margin-left: 10px;
      transition: 0.3s;
    }

    .nav-link:hover,
    .nav-link.active {
      color: #1d6f7a;
    }

    .nav-link.active {
      border-bottom: 2px solid #1d6f7a;
    }

    .navbar-toggler {
      border: none;
    }

    .navbar-toggler:focus {
      box-shadow: none;
    }

    .sample-content {
      text-align: center;
      padding: 60px 20px;
    }

    .sample-content h1 {
      color: #123f49;
      font-weight: 800;
    }
  </style>
</head>
<body>

  <nav class="navbar navbar-expand-lg fixed-top custom-navbar">
    <div class="container">
      <a class="navbar-brand" href="#">Campus Connect</a>

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="mainNavbar">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="home.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="events.html">Events</a></li>
          <li class="nav-item"><a class="nav-link" href="announcements.html">Announcements</a></li>
          <li class="nav-item"><a class="nav-link active" href="student-profiles.html">Student Profiles</a></li>
          <li class="nav-item"><a class="nav-link" href="study-resources.html">Study Resources</a></li>
          <li class="nav-item"><a class="nav-link" href="academic-calendar.html">Academic Calendar</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="sample-content">
    <h1>Student Profiles</h1>
    <p>This is the navbar section for your Campus Connect website.</p>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    const navLinks = document.querySelectorAll(".nav-link");

    navLinks.forEach(link => {
      link.addEventListener("click", function () {
        navLinks.forEach(item => item.classList.remove("active"));
        this.classList.add("active");
      });
    });
  </script>

</body>
</html>
